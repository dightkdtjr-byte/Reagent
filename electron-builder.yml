appId: kr.mamo.reagent-inventory
productName: ReagentInventory
directories:
  output: dist/installer
# 앱 파일을 app.asar로 묶지 않고 resources/app 폴더로 둔다. 업데이트 zip을 덮어써서 갱신할 수 있게 하기 위함.
asar: false
files:
  - "**/*"
  - "!dist/**"
  - "!electron-builder.yml"
  - "!.gitignore"
  - "!scripts/**"
  - "!.github/**"
win:
  target:
    - nsis
    - portable
  icon: icon.ico
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ReagentInventory
  include: installer.nsh
  installerLanguages:
    - ko_KR
  language: 1042
portable:
  artifactName: "${productName}-${version}-portable.exe"
